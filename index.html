<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pump Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:   "#c8f135",
            surface: "#1a1a1a",
            panel:   "#111111",
            border:  "#2a2a2a",
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
  </style>
</head>
<body class="bg-panel text-white font-mono min-h-screen">

  <!-- ─── Top bar ─────────────────────────────────────── -->
  <header class="border-b border-border bg-surface px-6 py-4 flex items-center justify-between sticky top-0 z-30">
    <div>
      <p class="text-brand font-bold text-sm tracking-widest uppercase">Pump Catalog</p>
      <p class="text-zinc-500 text-xs mt-1">Browse ready-made pump configurations and place an order</p>
    </div>
    <div class="flex items-center gap-3">
      <a href="/dashboard"
         class="text-xs text-zinc-400 border border-border rounded px-3 py-1.5 hover:text-brand hover:border-brand transition">
        ↗ Admin Dashboard
      </a>
      <div id="user-chip" class="hidden items-center gap-2 text-xs">
        <span class="w-7 h-7 rounded-full bg-brand text-black font-bold flex items-center justify-center" id="user-avatar">·</span>
        <div class="leading-tight">
          <p class="text-zinc-200" id="user-name">—</p>
          <p class="text-zinc-500 text-[10px]" id="user-email">—</p>
        </div>
        <button id="btn-logout"
                class="ml-1 px-2 py-1 border border-border rounded hover:border-red-500 hover:text-red-400 transition">
          Logout
        </button>
      </div>
      <span id="conn" class="text-xs text-zinc-500">checking…</span>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CATALOG                                               -->
  <!-- ═══════════════════════════════════════════════════ -->
  <div id="view-catalog" class="p-6">
    <div class="flex items-center gap-3 mb-5 flex-wrap">
      <input id="catalog-search" type="text"
             placeholder="Search catalog (series, size, name)…"
             class="flex-1 min-w-[240px] bg-surface border border-border rounded px-3 py-2 text-sm focus:outline-none focus:border-brand" />
      <span id="catalog-count" class="text-zinc-500 text-xs">—</span>
    </div>
    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="text-zinc-600 text-xs">Loading catalog…</div>
    </div>
  </div>

  <!-- ─── Catalog detail modal ────────────────────────── -->
  <div id="detail-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-40 p-4">
    <div class="bg-surface border border-border rounded-lg w-full max-w-2xl p-6 max-h-[88vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="font-bold text-lg text-brand" id="detail-title">Configuration</h2>
          <p class="text-zinc-500 text-xs" id="detail-sub">—</p>
        </div>
        <button onclick="closeDetail()" class="text-zinc-500 hover:text-white text-xl">✕</button>
      </div>
      <div id="detail-body" class="space-y-4"></div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeDetail()"
                class="px-4 py-2 border border-border text-sm rounded hover:bg-panel transition">Close</button>
        <button id="detail-order-btn"
                class="px-4 py-2 bg-brand text-black font-bold text-sm rounded hover:opacity-90 transition">
          Order this configuration
        </button>
      </div>
    </div>
  </div>

  <!-- ─── Order modal ─────────────────────────────────── -->
  <div id="result-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-40 p-4">
    <div class="bg-surface border border-border rounded-lg w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg text-brand" id="result-title">Order Configuration</h2>
        <button onclick="closeResult()" class="text-zinc-500 hover:text-white text-xl">✕</button>
      </div>

      <!-- Clean spec summary card -->
      <div id="result-body" class="border border-border rounded-lg bg-panel/50 overflow-hidden"></div>

      <!-- Order form -->
      <div id="order-form" class="mt-4 border border-border rounded p-4 bg-panel/50">
        <h3 class="text-zinc-400 text-xs uppercase tracking-wider mb-3">Place an order</h3>
        <div class="grid grid-cols-2 gap-3 items-end">
          <div>
            <label class="block text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Quantity</label>
            <input id="order-qty" type="number" min="1" value="1"
                   class="w-full bg-panel border border-border rounded px-3 py-2 text-sm focus:outline-none focus:border-brand" />
          </div>
          <div class="text-right">
            <p class="text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Unit price</p>
            <p id="order-unit-price" class="text-zinc-200 text-sm font-bold">—</p>
          </div>
        </div>
        <div class="mt-3 flex items-center justify-between border-t border-border pt-3">
          <span class="text-zinc-400 text-xs uppercase tracking-wider">Order total</span>
          <span id="order-total" class="text-brand text-lg font-bold">—</span>
        </div>
        <div class="mt-3">
          <label class="block text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Shipping address</label>
          <input id="order-shipping" type="text" placeholder="optional"
                 class="w-full bg-panel border border-border rounded px-3 py-2 text-sm focus:outline-none focus:border-brand" />
        </div>
        <div class="mt-3">
          <label class="block text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Notes</label>
          <textarea id="order-notes" rows="2" placeholder="optional"
                    class="w-full bg-panel border border-border rounded px-3 py-2 text-sm focus:outline-none focus:border-brand"></textarea>
        </div>
        <p id="order-error" class="hidden text-red-400 text-xs mt-2"></p>
      </div>

      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeResult();"
                class="px-4 py-2 border border-border text-sm rounded hover:bg-panel transition">Close</button>
        <button id="btn-order" onclick="placeOrder()"
                class="px-4 py-2 bg-brand text-black font-bold text-sm rounded hover:opacity-90 transition">
          Place order
        </button>
        <a href="/dashboard"
           class="px-4 py-2 border border-brand text-brand text-sm rounded hover:bg-brand hover:text-black transition">View dashboard</a>
      </div>
    </div>
  </div>

  <!-- ─── Toast ───────────────────────────────────────── -->
  <div id="toast" class="hidden fixed bottom-6 right-6 border rounded px-4 py-2 text-sm shadow-lg z-[60]"></div>

  <!-- ─── Auth gate ───────────────────────────────────── -->
  <div id="auth-gate"
       class="fixed inset-0 bg-panel/95 backdrop-blur-sm flex items-center justify-center z-40 p-6">
    <div class="w-full max-w-md border border-border rounded-lg bg-surface shadow-2xl">
      <div class="px-6 pt-6 pb-2 text-center">
        <p class="text-brand font-bold text-sm tracking-widest uppercase">Pump Catalog</p>
        <p class="text-zinc-500 text-xs mt-1">Sign in to continue</p>
      </div>

      <div class="flex border-b border-border mt-4">
        <button id="tab-login"
                class="flex-1 py-2 text-xs uppercase tracking-wider border-b-2 border-brand text-brand">
          Sign in
        </button>
        <button id="tab-register"
                class="flex-1 py-2 text-xs uppercase tracking-wider border-b-2 border-transparent text-zinc-400 hover:text-white transition">
          Create account
        </button>
      </div>

      <form id="auth-form" class="p-6 space-y-3" onsubmit="event.preventDefault(); submitAuth();">
        <div id="field-first" class="hidden">
          <label class="block text-zinc-400 text-xs mb-1 uppercase tracking-wider">first name</label>
          <input name="first_name" autocomplete="given-name"
                 class="w-full bg-panel border border-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-brand" />
        </div>
        <div id="field-last" class="hidden">
          <label class="block text-zinc-400 text-xs mb-1 uppercase tracking-wider">last name</label>
          <input name="last_name" autocomplete="family-name"
                 class="w-full bg-panel border border-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-brand" />
        </div>
        <div>
          <label class="block text-zinc-400 text-xs mb-1 uppercase tracking-wider">email</label>
          <input name="email" type="email" autocomplete="email" required
                 class="w-full bg-panel border border-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-brand" />
        </div>
        <div>
          <label class="block text-zinc-400 text-xs mb-1 uppercase tracking-wider">password</label>
          <input name="password" type="password" autocomplete="current-password" required minlength="6"
                 class="w-full bg-panel border border-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-brand" />
        </div>

        <p id="auth-error" class="hidden text-red-400 text-xs"></p>

        <button id="btn-auth-submit" type="submit"
                class="w-full px-4 py-2.5 bg-brand text-black font-bold text-sm rounded hover:opacity-90 transition">
          Sign in
        </button>
      </form>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════════════════
// Config
// ═══════════════════════════════════════════════════════════
const API = "";

// Component groups shown when rendering a full PumpConfig spec, with the
// field order to display for each.
const CONFIG_PARTS = [
  {
    key: "pump_info", label: "Pump Info",
    detail: [
      "series","size","pump_material","shaft_configuration","casing_metal",
      "casing_drain","casing_tap","casing_gasket","flange_configuration","spot_facing",
      "casing_wear_ring","tack_weld_wear_ring","casing_mounting","hardware",
      "seal_chamber_config","shipping_gasket","cradle_material"
    ],
  },
  {
    key: "seal", label: "Seal",
    detail: [
      "seal_option","seal_mfr","seal_configuration","seal_type","gland_type","gland_gasket",
      "shaft_sleeve_material","inboard_rotating_face","inboard_stationary_face","inboard_elastomer",
      "outboard_rotating_face","outboard_stationary_face","outboard_elastomer"
    ],
  },
  {
    key: "motor", label: "Motor",
    detail: [
      "motor_control","power_hp","speed","voltage","phase_hertz","frame",
      "enclosure","efficiency","c_face_adapter","manufacturer"
    ],
  },
  {
    key: "impeller", label: "Impeller",
    detail: ["impeller_range","impeller_trim","impeller_balance","impeller_material","impeller_wear_ring_material"],
  },
  {
    key: "base_plate", label: "Base Plate",
    detail: [
      "baseplate_type","baseplate_material","drip_pan","allignment_lugs","lifting_lugs",
      "leveling_screws","grounding_lugs","grout_hole","isolation_pads","stilts"
    ],
  },
  {
    key: "options", label: "Options",
    detail: [
      "coupling_type","coupling_guard","auxillary_nameplate","crating","oil_options",
      "bearing_frame_cooling","lubrication_options","oil_seat","sight_gauge",
      "magnetic_drain","expansion_chamber"
    ],
  },
  {
    key: "test_documentation", label: "Test Docs",
    detail: [
      "performance_testing","hydro_testing","vibration","sound_level","general_inspection",
      "documenttation_1","documenttation_2","documenttation_3","documenttation_4",
      "documenttation_5","documenttation_6"
    ],
  },
];

// State
let catalogRows     = [];
let lastSavedConfig = null;

// ═══════════════════════════════════════════════════════════
// Tiny helpers
// ═══════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);

function apiFetch(path, opts = {}) {
  return fetch(path, { credentials: "include", ...opts, headers: { ...(opts.headers || {}) } });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg, kind = "info") {
  const el = $("toast");
  el.textContent = msg;
  el.className = "fixed bottom-6 right-6 border rounded px-4 py-2 text-sm shadow-lg z-[60] " +
    (kind === "ok"  ? "bg-surface border-brand text-brand" :
     kind === "err" ? "bg-surface border-red-700 text-red-400" :
                      "bg-surface border-border text-zinc-200");
  el.classList.remove("hidden");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add("hidden"), 2600);
}

function fmtMoney(v) {
  if (v == null || v === "") return null;
  const n = Number(v);
  return isNaN(n) ? String(v) : `$${n.toFixed(2)}`;
}

async function parseError(res) {
  const err = await res.json().catch(() => ({}));
  if (typeof err.detail === "string") return err.detail;
  if (Array.isArray(err.detail))
    return err.detail.map(d => `${(d.loc || []).slice(-1)}: ${d.msg}`).join(" · ");
  return `HTTP ${res.status}`;
}

// ═══════════════════════════════════════════════════════════
// Connection ping
// ═══════════════════════════════════════════════════════════
async function ping() {
  try {
    const r = await apiFetch(`${API}/health`);
    $("conn").textContent = r.ok ? "● connected" : `● error ${r.status}`;
    $("conn").className   = r.ok ? "text-xs text-brand" : "text-xs text-red-400";
  } catch {
    $("conn").textContent = "● offline";
    $("conn").className   = "text-xs text-red-400";
  }
}

// ═══════════════════════════════════════════════════════════
// Catalog
// ═══════════════════════════════════════════════════════════
async function loadCatalog() {
  const grid = $("catalog-grid");
  grid.innerHTML = `<div class="text-zinc-600 text-xs">Loading catalog…</div>`;
  try {
    const res = await apiFetch(`${API}/pump-config/?catalog=true`);
    if (res.status === 401) return forceLogout();
    if (!res.ok) throw new Error(await parseError(res));
    catalogRows = await res.json();
    renderCatalog(catalogRows);
  } catch (e) {
    grid.innerHTML = `<div class="text-red-400 text-xs">⚠ Failed to load catalog: ${escHtml(e.message)}</div>`;
    $("catalog-count").textContent = "—";
  }
}

function renderCatalog(rows) {
  const grid = $("catalog-grid");
  const total = catalogRows.length;
  $("catalog-count").textContent = `${rows.length} of ${total} configurations`;

  if (!rows.length) {
    grid.innerHTML = `<div class="text-zinc-600 text-xs italic">No configurations match.</div>`;
    return;
  }

  grid.innerHTML = rows.map(cfg => {
    const pi = cfg.pump_info || {};
    const motor = cfg.motor || {};
    const seal = cfg.seal || {};
    const price = fmtMoney(cfg.list_price);
    return `
      <div class="border border-border rounded-lg bg-surface p-4 flex flex-col hover:border-brand/60 transition">
        <div class="flex items-start justify-between gap-2">
          <p class="text-sm font-bold text-zinc-100 leading-snug">${escHtml(cfg.name || pi.series || "Configuration")}</p>
          <span class="shrink-0 text-[10px] px-2 py-0.5 rounded-full border border-brand/40 text-brand">${escHtml(pi.series || "—")}</span>
        </div>
        <div class="mt-3 space-y-1.5 text-xs text-zinc-400 flex-1">
          <div class="flex justify-between"><span class="text-zinc-600">Size</span><span class="text-zinc-300">${escHtml(pi.size || "—")}</span></div>
          <div class="flex justify-between"><span class="text-zinc-600">Material</span><span class="text-zinc-300">${escHtml(pi.pump_material || "—")}</span></div>
          <div class="flex justify-between"><span class="text-zinc-600">Seal</span><span class="text-zinc-300">${escHtml(seal.seal_type || "—")}</span></div>
          <div class="flex justify-between"><span class="text-zinc-600">Motor</span><span class="text-zinc-300">${escHtml([motor.power_hp && motor.power_hp + " HP", motor.voltage].filter(Boolean).join(" · ") || "—")}</span></div>
        </div>
        <div class="mt-3 pt-3 border-t border-border flex items-center justify-between">
          <span class="text-brand font-bold text-sm">${price || "Quote"}</span>
          <div class="flex gap-2">
            <button onclick="openDetail('${cfg.id}')"
                    class="px-2.5 py-1.5 text-xs border border-border rounded hover:border-brand hover:text-brand transition">Details</button>
            <button onclick="orderCatalog('${cfg.id}')"
                    class="px-2.5 py-1.5 text-xs bg-brand text-black font-bold rounded hover:opacity-90 transition">Order</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

$("catalog-search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = q
    ? catalogRows.filter(cfg => {
        const hay = [cfg.name, cfg.pump_info?.series, cfg.pump_info?.size,
                     cfg.pump_info?.pump_material, cfg.seal?.seal_type, cfg.motor?.power_hp]
                    .filter(Boolean).join(" ").toLowerCase();
        return hay.includes(q);
      })
    : catalogRows;
  renderCatalog(filtered);
});

function findConfig(id) {
  return catalogRows.find(c => c.id === id);
}

// ─── Catalog detail modal ──────────────────────────
function renderPartGrid(part, fields) {
  if (!part) return `<p class="text-zinc-600 text-xs italic">Not included.</p>`;
  const cells = fields
    .filter(f => f in part)
    .map(f => {
      const v = part[f];
      const empty = v == null || v === "" || v === "Not required" || v === "N/A";
      return `
        <div class="border-b border-border/60 pb-1">
          <p class="text-zinc-600 text-[10px] uppercase tracking-wider">${f}</p>
          <p class="text-zinc-${empty ? '600' : '200'} text-xs ${empty ? 'italic' : ''}">${empty ? '—' : escHtml(String(v))}</p>
        </div>`;
    }).join("");
  return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2">${cells}</div>`;
}

function openDetail(id) {
  const cfg = findConfig(id);
  if (!cfg) return;
  $("detail-title").textContent = cfg.name || "Configuration";
  $("detail-sub").textContent = [cfg.pump_info?.series, cfg.pump_info?.size].filter(Boolean).join(" · ") || cfg.id;

  $("detail-body").innerHTML = CONFIG_PARTS.map(p => {
    const part = cfg[p.key];
    if (!part) return "";
    return `
      <div>
        <p class="text-brand text-xs uppercase tracking-wider mb-2">${p.label}</p>
        ${renderPartGrid(part, p.detail)}
      </div>`;
  }).join("") + (cfg.notes ? `<p class="text-zinc-500 text-xs italic pt-2 border-t border-border">${escHtml(cfg.notes)}</p>` : "");

  $("detail-order-btn").onclick = () => { closeDetail(); orderCatalog(id); };
  $("detail-modal").classList.remove("hidden");
}
function closeDetail() { $("detail-modal").classList.add("hidden"); }
window.openDetail = openDetail;
window.closeDetail = closeDetail;

// ═══════════════════════════════════════════════════════════
// Order modal
// ═══════════════════════════════════════════════════════════
// Render a PumpConfig as a clean spec card (not raw JSON).
function renderConfigCard(cfg) {
  const pi = cfg.pump_info || {};
  const price = fmtMoney(cfg.list_price);

  const partsHtml = CONFIG_PARTS.map(p => {
    const part = cfg[p.key];
    if (!part) return "";
    const rows = p.detail
      .map(f => [f, part[f]])
      .filter(([, v]) => v != null && String(v).trim() !== "" && v !== "Not required" && v !== "N/A")
      .map(([f, v]) => `
        <div class="flex justify-between gap-3 py-0.5">
          <span class="text-zinc-600 text-[11px]">${escHtml(f.replace(/_/g, " "))}</span>
          <span class="text-zinc-300 text-[11px] text-right truncate">${escHtml(String(v))}</span>
        </div>`).join("");
    if (!rows) return "";
    return `
      <div class="px-4 py-3 border-t border-border">
        <p class="text-brand text-[10px] uppercase tracking-wider mb-1.5">${p.label}</p>
        ${rows}
      </div>`;
  }).join("");

  return `
    <div class="px-4 py-3 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="text-zinc-100 font-bold text-sm truncate">${escHtml(cfg.name || pi.series || "Configuration")}</p>
        <p class="text-zinc-500 text-xs">${escHtml([pi.series, pi.size, pi.pump_material].filter(Boolean).join(" · ") || "—")}</p>
      </div>
      <div class="text-right shrink-0">
        <p class="text-zinc-600 text-[10px] uppercase tracking-wider">List price</p>
        <p class="text-brand font-bold">${price || "—"}</p>
      </div>
    </div>
    ${partsHtml}`;
}

function orderCatalog(id) {
  const cfg = findConfig(id);
  if (!cfg) return;
  lastSavedConfig = cfg;
  $("result-title").textContent = "Order Configuration";
  $("result-body").innerHTML = renderConfigCard(cfg);
  resetOrderForm();
  $("result-modal").classList.remove("hidden");
}
window.orderCatalog = orderCatalog;

function closeResult() { $("result-modal").classList.add("hidden"); }
window.closeResult = closeResult;

// Price comes from the server (the config's list_price). Recompute the
// displayed total whenever the quantity changes.
function unitPrice() {
  const p = Number(lastSavedConfig?.list_price);
  return isNaN(p) ? 0 : p;
}

function refreshOrderTotals() {
  const qty = parseInt($("order-qty").value, 10) || 1;
  const unit = unitPrice();
  $("order-unit-price").textContent = unit > 0 ? `$${unit.toFixed(2)}` : "no price set";
  $("order-total").textContent = unit > 0 ? `$${(unit * qty).toFixed(2)}` : "—";
  const orderable = unit > 0;
  $("btn-order").disabled = !orderable;
  $("btn-order").classList.toggle("opacity-40", !orderable);
  $("btn-order").classList.toggle("cursor-not-allowed", !orderable);
}

function resetOrderForm() {
  $("order-qty").value = "1";
  $("order-shipping").value = "";
  $("order-notes").value = "";
  $("order-error").classList.add("hidden");
  $("btn-order").textContent = "Place order";
  refreshOrderTotals();
}
$("order-qty").addEventListener("input", refreshOrderTotals);

// ═══════════════════════════════════════════════════════════
// Place an order
// ═══════════════════════════════════════════════════════════
async function placeOrder() {
  if (!lastSavedConfig?.id) { toast("No configuration selected", "err"); return; }

  const qty = parseInt($("order-qty").value, 10) || 1;
  const shipping = $("order-shipping").value.trim();
  const notes    = $("order-notes").value.trim();

  if (qty < 1) {
    $("order-error").textContent = "Quantity must be at least 1";
    $("order-error").classList.remove("hidden");
    return;
  }

  // No unit_price here: the server prices each line from the config's list_price.
  const payload = {
    items: [{ pump_config_id: lastSavedConfig.id, quantity: qty }],
    shipping_address: shipping || null,
    notes: notes || null,
  };

  const btn = $("btn-order");
  btn.disabled = true; btn.textContent = "Placing order…";
  $("order-error").classList.add("hidden");
  try {
    const res = await apiFetch(`${API}/orders/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (res.status === 401) return forceLogout();
    if (!res.ok) throw new Error(await parseError(res));
    const order = await res.json();
    toast(`Order ${String(order.id).slice(0,8)}… placed · $${Number(order.total).toFixed(2)}`, "ok");
    btn.textContent = "✓ Ordered"; btn.disabled = true;
  } catch (e) {
    $("order-error").textContent = e.message;
    $("order-error").classList.remove("hidden");
    btn.disabled = false; btn.textContent = "Place order";
  }
}
window.placeOrder = placeOrder;

// ═══════════════════════════════════════════════════════════
// Auth
// ═══════════════════════════════════════════════════════════
let authMode = "login";
let currentUser = null;

function showAuthGate(show) {
  $("auth-gate").classList.toggle("hidden", !show);
  $("auth-gate").classList.toggle("flex", show);
}

function setAuthMode(m) {
  authMode = m;
  const isReg = m === "register";
  $("tab-login").classList.toggle("border-brand", !isReg);
  $("tab-login").classList.toggle("text-brand",   !isReg);
  $("tab-login").classList.toggle("border-transparent", isReg);
  $("tab-login").classList.toggle("text-zinc-400", isReg);
  $("tab-register").classList.toggle("border-brand", isReg);
  $("tab-register").classList.toggle("text-brand",   isReg);
  $("tab-register").classList.toggle("border-transparent", !isReg);
  $("tab-register").classList.toggle("text-zinc-400", !isReg);
  $("field-first").classList.toggle("hidden", !isReg);
  $("field-last").classList.toggle("hidden", !isReg);
  $("btn-auth-submit").textContent = isReg ? "Create account" : "Sign in";
  $("auth-error").classList.add("hidden");
}

async function checkAuth() {
  try {
    const res = await apiFetch(`${API}/auth/me`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

function renderUserChip(user) {
  currentUser = user;
  if (!user) {
    $("user-chip").classList.add("hidden");
    $("user-chip").classList.remove("flex");
    return;
  }
  const initials = ((user.first_name?.[0] || "") + (user.last_name?.[0] || "")).toUpperCase() || "U";
  $("user-avatar").textContent = initials;
  $("user-name").textContent   = `${user.first_name} ${user.last_name}`.trim() || user.email;
  $("user-email").textContent  = user.email;
  $("user-chip").classList.remove("hidden");
  $("user-chip").classList.add("flex");
}

async function submitAuth() {
  const data = Object.fromEntries(new FormData($("auth-form")).entries());
  const url  = authMode === "register" ? `${API}/auth/register` : `${API}/auth/login`;
  $("auth-error").classList.add("hidden");
  $("btn-auth-submit").disabled = true;
  $("btn-auth-submit").textContent = authMode === "register" ? "Creating…" : "Signing in…";
  try {
    const res = await apiFetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(await parseError(res));
    const body = await res.json();
    renderUserChip(body.user);
    showAuthGate(false);
    toast(authMode === "register" ? "Account created" : "Signed in", "ok");
    bootApp();
  } catch (e) {
    $("auth-error").textContent = e.message;
    $("auth-error").classList.remove("hidden");
  } finally {
    $("btn-auth-submit").disabled = false;
    $("btn-auth-submit").textContent = authMode === "register" ? "Create account" : "Sign in";
  }
}
window.submitAuth = submitAuth;

async function logout() {
  try { await apiFetch(`${API}/auth/logout`, { method: "POST" }); } catch {}
  forceLogout();
  toast("Signed out", "ok");
}

function forceLogout() {
  renderUserChip(null);
  catalogRows = [];
  lastSavedConfig = null;
  showAuthGate(true);
}

// ═══════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════
function bootApp() {
  ping();
  loadCatalog();
}

window.addEventListener("DOMContentLoaded", async () => {
  $("tab-login").addEventListener("click",   () => setAuthMode("login"));
  $("tab-register").addEventListener("click",() => setAuthMode("register"));
  $("btn-logout").addEventListener("click", logout);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeResult(); closeDetail(); }
  });

  setAuthMode("login");

  const user = await checkAuth();
  if (user) {
    renderUserChip(user);
    showAuthGate(false);
    bootApp();
  } else {
    showAuthGate(true);
  }
});
</script>
</body>
</html>
